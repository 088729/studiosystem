name: Release

# Publishes to PyPI when a v* tag is pushed. The tag must match the version
# in pyproject.toml — no version drift between git history and the artifact.

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI trusted publishing (no API token in repo secrets)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(uv run python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG pyproject=$PKG"
          test "$TAG" = "$PKG" || { echo "version mismatch"; exit 1; }

      - name: Ruff
        run: uv run ruff check .

      - name: Zero-residue scan
        run: uv run python scripts/zero_residue_scan.py

      - name: pytest
        run: uv run pytest -q

      - name: Build wheel + sdist
        run: uv build

      - name: Smoke the built wheel (uvx-style, offline)
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/python -m studiosystem_mcp --help >/dev/null

      # Trusted publishing: configure the `release` environment on PyPI
      # (pending publisher: this repo, workflow file release.yml) before the
      # first tag push. Uncomment once configured:
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
