name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Ruff
        run: uv run ruff check .

      - name: Zero-residue scan
        run: uv run python scripts/zero_residue_scan.py

      - name: pytest
        run: uv run pytest -q

      - name: CLI smoke
        run: uv run studiosystem-mcp --help

      - name: Build wheel
        run: uv build

  # §8.3 protocol compatibility matrix: every supported protocol version must
  # answer tools/list + a read-only call + the confirmation flow (degradation
  # contract pinned in tests/test_protocol_matrix.py).
  protocol-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Protocol matrix (2026-07-28 / 2025-11-25)
        run: uv run pytest tests/test_protocol_matrix.py -v
