[project]
name = "studiosystembackend"
version = "0.1.0"
description = "XMind case management backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.140.0",
    "uvicorn[standard]>=0.34.0",
    "motor>=3.6.0,<3.7.0",
    "beanie>=1.30.0,<2.0.0",
    "pymongo>=4.9.0,<4.11.0",
    "pyjwt>=2.10.0",
    "passlib>=1.7.4",
    "bcrypt>=3.2.2,<4.0.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "openpyxl>=3.1.0",
    "GitPython>=3.1.43,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "pytest-dotenv>=0.5.2",
    "moto[server]>=5.0",  # 本地 S3 模拟器：手动验证 STORAGE_BACKEND=s3 用（moto_server）
]
# STORAGE_BACKEND=s3 时的 S3 兼容对象存储（AWS S3 / OSS / COS / 七牛 / OBS / MinIO / R2）
s3 = [
    "boto3>=1.34.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
